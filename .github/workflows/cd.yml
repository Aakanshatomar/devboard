#GOAL : To deploy image from CI steps once the CI workflow is successful
name: CD
 
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - master

jobs:
    deploys:
        if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master'  }}
     runs-on: self-hosted
     steps:
         - name: Checkout code
          uses: actions/checkout@v7

         - name: Copy example env to main env
           run: cp .env.example .env

         - name: Docker login
           uses: docker/login-action@v2
           with:
              username: ${{ secrets.DOCKER_USERNAME }}
              password: ${{ secrets.DOCKER_PASSWORD }}

         - name: Deploy the container to docker 
           run: |
                docker compose pull
                docker compose up -d

            