  # Goal: link, build, test, and push the code to Docker Hubname: CI
name: CI

on:
   push:
    branches:
      - master


jobs:
    frontend:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up Node.js
          uses: actions/setup-node@v3
          with:
            node-version: 20
            cache: npm
            cache-dependency-path: frontend/package-lock.json

        - name: Install dependencies
          run: npm install
          working-directory: frontend

        - name: Run Lint
          run: npm run lint
          working-directory: frontend

        - name: Run Tests
          run: npm run test
          working-directory: frontend