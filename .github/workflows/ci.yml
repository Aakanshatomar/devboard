name: CI

on: 
  push:
    branches: [master]

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v7
      - name: Docker setup [Login]
      uses: docker/login-action@v4
      with:
       username: ${{ vars.DOCKER_USERNAME }}
       password: ${{ secrets.DOCKER_PASSWORD }}
  
